plugins {
    id 'com.android.library'
}

// Xirsys credentials are read from <root>/secrets.properties (not tracked by git;
// see secrets.properties.example). Missing file or key -> empty string, so the build still works.
def secretsPropertiesFile = rootProject.file('secrets.properties')
def secretsProperties = new java.util.Properties()
if (secretsPropertiesFile.exists()) {
    secretsPropertiesFile.withInputStream { secretsProperties.load(it) }
}
def secretField = { String key ->
    def value = secretsProperties.getProperty(key, '')
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// Missing Xirsys credentials only warn (screen-share ICE lookup will not authenticate).
def missingXirsysSecrets = ['XIRSYS_IDENT', 'XIRSYS_SECRET'].findAll {
    secretsProperties.getProperty(it, '').trim().isEmpty()
}
def missingXirsysSecretsMessage = "secrets.properties missing or incomplete (empty: ${missingXirsysSecrets.join(', ')}) - see secrets.properties.example".toString()
tasks.register('checkXirsysSecrets') {
    doLast {
        if (!missingXirsysSecrets.isEmpty()) {
            logger.warn("WARNING: " + missingXirsysSecretsMessage)
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn 'checkXirsysSecrets'
    }
}

android {
    namespace "com.tabnova.screenshare"
    compileSdk 36
    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField "String", "XIRSYS_IDENT", secretField('XIRSYS_IDENT')
        buildConfigField "String", "XIRSYS_SECRET", secretField('XIRSYS_SECRET')
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'io.getstream:stream-webrtc-android:1.3.8'

    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'androidx.appcompat:appcompat:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    implementation('io.socket:socket.io-client:0.8.3') {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
}