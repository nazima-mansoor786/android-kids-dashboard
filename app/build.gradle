apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

// Release signing is read from <root>/keystore.properties (not tracked by git).
// If the file is missing, release builds are left unsigned and debug builds are unaffected.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new java.util.Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.tabnova.aidashboard"
    compileSdk 36
    defaultConfig {
        //com.tabnova.classroomapp
        //com.tabnova.aidashboard
        applicationId "com.tabnova.aidashboard"
        minSdk 23
        targetSdk 36
        versionCode 116
        versionName "74.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "Kids_Dashboard-$versionCode-$versionName")
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds = false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError = false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            //debuggable true
        }
        /*debug {
            signingConfig signingConfigs.release
            debuggable true
        }*/
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1' // TODO verify: latest version (Google Maven unreachable here)

    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    //No Inspection Gradle Compatible
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // FIREBASE (versions managed by the BoM)
    implementation platform('com.google.firebase:firebase-bom:34.4.0') // TODO verify: latest BoM (Firebase notes unreachable)
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // FOR GOOGLE LOGIN
    implementation 'com.google.android.gms:play-services-auth:22.0.0' // TODO verify: newer 22.x (official Authorization guide shows 22.0.0)

    // Add the Firebase Crashlytics SDK.
    implementation 'com.google.firebase:firebase-crashlytics'

    //LOCATION
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // GOOGLE PLAY BILLING LIBRARY
    implementation 'com.android.billingclient:billing:8.3.0'

    // WORK MANAGER LIBRARY
    // 2.12.0+ requires minSdk 24; 2.11.x is the latest line supporting minSdk 23.
    implementation 'androidx.work:work-runtime:2.11.2'

    // IMAGE LOADER LIBRARY
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // RETROFIT LIBRARY
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.1'

    //For Samsung Knox
    compileOnly files('libs/knoxsdk.jar')
    runtimeOnly files('libs/supportlib.jar')

    // Replaces lifecycle-extensions; lifecycle-process provides ProcessLifecycleOwner.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'

    implementation 'org.jsoup:jsoup:1.24.1'

    // DP AND SP LIBRARIES
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

    /*implementation ("com.google.android.play:core:1.9.0"){
        exclude group: 'com.google.android.play', module: 'core'
    }*/

    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'

    implementation project(path: ':vpnapp')
    implementation project(path: ':screenshare')

    testImplementation 'junit:junit:4.13.2'
}
